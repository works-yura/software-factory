packages:
  - packages/*

catalog:
  typescript: ^7.0.2
  vitest: 4.1.11
  zod: ^4.6.7

# Exact versions from v3, so the Mastra packages resolve to what v3 runs.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@google/genai': false
  onnxruntime-node: false
  agent-browser: false
  bufferutil: false
  edgedriver: false
  geckodriver: false
  msw: false

